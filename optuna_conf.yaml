---
experiment_name: optuna_example
root: /opt/Datasets/security-datasets-for-testing/
seed: 1111
validation_split: 0.1
batch_size_train: 1000
batch_size_test: 2000

classes:
  - "Benign"
  - "Malicious"
plotting_pths:
  training: "./src/plot_utils/plot_train_perf.py"
  testing: "./src/plot_utils/plot_test_perf.py"
paths:
  experiment_dir: ./experiments

dataset_loader:
  data_subdir: data
  persist_cache_threshold: 20000
  cache_dir: ./cache
  labeled_filenames:
    - conn.log.labeled
    - labeled-conn.log
    - conn.log
  file_encoding: utf-8
  file_errors: ignore
  shuffle_per_epoch: false

features:
  default_label: Benign
  protocols_to_discard:
    - arp
    - ARP
    - icmp
    - igmp
    - ipv6-icmp
    - ""

preprocessing:
  steps:
    - name: "scaler"
      type: "StandardScaler"
      params: {}
  save_steps: true
  step_filename_template: "{name}.bin"

model:
  wrapper: RiverClassifierWrapper
  classifier_type: river.forest.ARFClassifier
  classifier_params:
    lambda_value: 10
    n_models: 10

commands:
  - name: "train_main"
    command: "train"
    mixer:
      type: "sequence"
      datasets:
        - "008"
        - "009"
        - "010"
        - "011"
        - "012"
        - "013"

  - name: "test_all"
    command: "test"
    mixer:
      type: "sequence"
      datasets:
        - "001"
        - "008"
        - "009"
        - "010"
        - "011"
        - "012"
        - "013"
        - "014"
        - "015"
        - "016"
        - "017"
        - "018"
        - "020"
        - "021"
        - "025"
        - "026"
        - "030"
        - "031"
        - "035"
        - "036"
        - "037"

optuna:
  n_jobs: 2
  enabled: true
  pruner:
    type: median
    n_warmup_steps: 5
  n_trials: 3
  metric:
    - "f1"
    - "fpr"
  directions:
    - "maximize"
    - "minimize"
  hyperparameters:
    model:
      classifier_type:
        type: categorical
        choices:
          - "river.forest.ARFClassifier"
          - "river.ensemble.ADWINBoostingClassifier"
      classifier_params:
        river.forest.ARFClassifier:
          lambda_value:
            type: int
            low: 1
            high: 20
          n_models:
            type: int
            low: 5
            high: 50
          grace_period:
            type: int
            low: 25
            high: 200
        river.ensemble.ADWINBoostingClassifier:
          n_models:
            type: int
            low: 2
            high: 20
          learning_rate:
            type: float
            low: 0.1
            high: 1.0
          model:
            type:
              type: categorical
              choices:
                - "HoeffdingAdaptiveTreeClassifier"
                - "HoeffdingTreeClassifier"
            params:
              HoeffdingAdaptiveTreeClassifier:
                max_depth:
                  type: int
                  low: 5
                  high: 30
                  when:
                    model.classifier_params.ADWINBoostingClassifier.model.type:
                      HoeffdingAdaptiveTreeClassifier
                delta:
                  type: float
                  low: 1.0e-8
                  high: 1.0e-5
                  log: true
                  when:
                    model.classifier_params.ADWINBoostingClassifier.model.type:
                      HoeffdingAdaptiveTreeClassifier
              HoeffdingTreeClassifier:
                grace_period:
                  type: int
                  low: 50
                  high: 500
                  when:
                    model.classifier_params.ADWINBoostingClassifier.model.type:
                      HoeffdingTreeClassifier
                split_confidence:
                  type: float
                  low: 1.0e-7
                  high: 1.0e-3
                  log: true
                  when:
                    model.classifier_params.ADWINBoostingClassifier.model.type:
                      HoeffdingTreeClassifier
    commands:
      - name: "train_main"
        command: "train"
        mixer:
          type:
            type: categorical
            choices:
              - "sequence"
              - "random"
          chunk_size:
            type: int
            low: 2000
            high: 10000
            when:
              commands[0].mixer.type: "random"
          datasets:
            type: categorical
            multiple: true
            min: 3
            max: 6
            choices:
              - "001"
              - "008"
              - "009"
              - "010"
              - "011"
              - "012"
              - "013"
              - "014"
