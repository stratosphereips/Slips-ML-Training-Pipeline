---
# Offline learning-parameter study of the SLIPS federated module's RLH model
# (random_projection_mlp: frozen shared projection 18->256, fc1 256->16,
# head 16->2). Run: python3 run_fl_rlh_tuning.py --config <this file>
# Every configuration trains from the same shared init (no warm start).

experiment_name: fl_rlh_tuning

# dataset root (folders named <id>-..., each with data/conn.log.labeled)
root: ~/pipeline_ml_training_for_SLIPS/datasets
data_subdir: data
# small mixed captures (CTU-50 / FEEL): one Windows host, benign use plus
# attacks from the Internet; ~29k labelled conn flows after Background
datasets: ["008", "010", "011", "012", "037"]
# stratified cap per dataset (null = all flows)
max_flows_per_dataset: null
cache_dir: ./src/cache

# model seed (projection + shared init) and data seed
seed: 1111
# fixed stratified hold-out, used once at the end
test_size: 0.1
# stratified k-fold on the other 90%
cv_folds: 5

# as in the module with balancing=undersample (SLIPS dc15aad7d): StandardScaler
# fit on all training rows (the module: the whole window) before 50/50
# undersampling, unweighted cross-entropy
preprocessing:
  undersample: true
  # train_all (the module now) or train_undersampled (before dc15aad7d)
  scaler_fit_on: train_all
  # the module's per-batch class weights (off with undersampling)
  class_weighting: false

# grid: every combination is cross-validated
search:
  lr: [0.003, 0.01, 0.03, 0.1]
  scheduler: [none, cosine, cyclic, onecycle]
  # 0 = full batch (the module: one step per epoch)
  batch_size: [0, 256, 100]
  # optimizer steps (the module: 15 per window)
  steps: [15, 50, 200, 1000]

scheduler_params:
  # lr -> 1% of lr
  cosine: {min_factor: 0.01}
  # triangular 10% -> lr -> 10%, 3 times over the budget
  cyclic: {cycles: 3, low_factor: 0.1}
  onecycle: {pct_start: 0.3, div_factor: 25, final_div_factor: 10000}

# steps at which every run is evaluated (convergence curves); budgets added
checkpoints: [1, 2, 3, 5, 8, 10, 15, 20, 30, 50, 75, 100, 150, 200, 300,
              500, 750, 1000]

final:
  # best mean CV MCC configs, retrained on all 90% and scored on the hold-out
  top_k: 3
  # always retrained and tested too
  reference_configs:
    # the FL module now: lr 0.03, 15 full-batch steps per window
    - {lr: 0.03, scheduler: none, batch_size: 0, steps: 15}
    # the FL module's default lr
    - {lr: 0.01, scheduler: none, batch_size: 0, steps: 15}

runtime:
  # parallel training processes, torch threads per process
  workers: 2
  threads_per_worker: 2
