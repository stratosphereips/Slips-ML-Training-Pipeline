<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UMAP Dataset Explorer</title>
    <style>
      :root {
        --bg: #f4efe3;
        --bg-accent: #efe2c7;
        --ink: #1f1b16;
        --muted: #6b5b4c;
        --panel: #fff8ea;
        --border: #d8c7aa;
        --accent: #2f5f4a;
        --accent-2: #8a3b2f;
        --shadow: rgba(31, 27, 22, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Palatino Linotype", "Book Antiqua", Palatino, serif;
        color: var(--ink);
        background:
          radial-gradient(1100px 700px at 10% -10%, #fff7e3 0%, transparent 60%),
          radial-gradient(900px 600px at 100% 0%, #f3e7cf 0%, transparent 55%),
          linear-gradient(120deg, var(--bg), var(--bg-accent));
      }

      .page {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 20px;
        padding: 20px;
        min-height: 100vh;
        animation: fade-in 0.5s ease;
      }

      @keyframes fade-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      header {
        grid-column: 1 / -1;
        padding: 8px 12px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 8px 18px var(--shadow);
      }

      .header-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      header h1 {
        margin: 0 0 4px 0;
        font-size: 18px;
      }

      header p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        box-shadow: 0 8px 18px var(--shadow);
      }

      .sidebar {
        width: 320px;
        min-width: 220px;
        max-width: 520px;
        resize: horizontal;
        overflow: auto;
      }

      .sidebar-hidden .sidebar {
        display: none;
      }

      .sidebar-hidden .page {
        grid-template-columns: 1fr;
      }

      .panel h2 {
        margin-top: 0;
        font-size: 16px;
      }

      .controls {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .dataset-list {
        max-height: 340px;
        overflow: auto;
        border: 1px solid var(--border);
        background: #fffdf7;
        padding: 10px;
        border-radius: 8px;
      }

      .dataset-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        padding: 4px 0;
      }

      .dataset-count {
        color: var(--muted);
        font-size: 12px;
        margin-left: auto;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 120px;
        font-size: 12px;
        color: var(--muted);
      }

      .field input {
        color: var(--ink);
      }

      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      input[type="number"],
      input[type="text"],
      select {
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #fffdf7;
        font-size: 13px;
        color: var(--ink);
        font-family: inherit;
      }

      button {
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 13px;
        cursor: pointer;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      button.small {
        padding: 6px 10px;
        font-size: 12px;
      }

      button.secondary {
        background: var(--accent-2);
      }

      button.ghost {
        background: transparent;
        color: var(--accent);
        border: 1px solid var(--accent);
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 4px 10px rgba(47, 95, 74, 0.2);
      }

      input[type="range"] {
        width: 100%;
      }

      .status {
        font-size: 13px;
        color: var(--muted);
      }

      .plot-area {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }


      .plot-frame {
        background: #ffffff;
        border: 1px dashed var(--border);
        border-radius: 12px;
        padding: 10px;
        height: 720px;
        min-height: 420px;
        display: flex;
        align-items: center;
        justify-content: center;
        resize: vertical;
        overflow: auto;
      }

      .plot-frame img,
      .plot-frame iframe {
        max-width: 100%;
        height: 100%;
        border-radius: 8px;
      }

      .plot-frame iframe {
        width: 100%;
        height: 100%;
        border: none;
      }

      .summary {
        font-size: 13px;
        color: var(--muted);
      }

      .output-path {
        font-size: 12px;
        color: var(--muted);
        word-break: break-all;
      }

      @media (max-width: 900px) {
        .page {
          grid-template-columns: 1fr;
        }

      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <div class="header-row">
          <div class="header-content">
            <h1>UMAP Dataset Explorer</h1>
            <p>Pick datasets, set sample rate, and recompute UMAP.</p>
          </div>
          <button id="toggle-panel" class="ghost small">Hide panel</button>
        </div>
      </header>

      <section class="panel controls sidebar" id="sidebar">
        <h2>Datasets</h2>
        <div class="row">
          <button id="select-all" class="ghost">Select all</button>
          <button id="clear-all" class="ghost">Clear</button>
        </div>
        <div id="dataset-list" class="dataset-list">
          <div class="status">Loading datasets...</div>
        </div>

        <div>
          <h2>Sample (%)</h2>
          <input id="sample-slider" type="range" min="0.01" max="100" step="0.01" value="10">
          <div class="row">
            <input id="sample-input" type="number" min="0.01" max="100" step="0.01" value="10">
            <div class="status">Sample: <span id="sample-value">10.00</span>%</div>
          </div>
        </div>

        <div>
          <h2>Max samples per dataset</h2>
          <div class="row">
            <input id="max-samples" type="number" min="1" step="1" placeholder="optional">
            <div class="status">Blank or 0 = no cap</div>
          </div>
        </div>

        <div>
          <h2>UMAP params</h2>
          <div class="row">
            <label class="field">
              <span>n_neighbors</span>
              <input id="umap-neighbors" type="number" min="2" step="1" value="15">
            </label>
            <label class="field">
              <span>min_dist</span>
              <input id="umap-min-dist" type="number" min="0" step="0.01" value="0.1">
            </label>
          </div>
          <div class="row">
            <label class="field">
              <span>metric</span>
              <select id="umap-metric">
                <option value="euclidean" selected>euclidean</option>
                <option value="manhattan">manhattan</option>
                <option value="chebyshev">chebyshev</option>
                <option value="minkowski">minkowski</option>
                <option value="cosine">cosine</option>
                <option value="correlation">correlation</option>
                <option value="hamming">hamming</option>
                <option value="jaccard">jaccard</option>
              </select>
            </label>
            <label class="field">
              <span>spread</span>
              <input id="umap-spread" type="number" min="0" step="0.01" value="1.0">
            </label>
          </div>
        </div>

        <div>
          <h2>Save</h2>
          <div class="row">
            <input id="save-name" type="text" placeholder="optional filename">
            <button id="save-umap" class="secondary">Save to disk</button>
          </div>
          <div class="output-path">Folder: <span id="output-dir">-</span></div>
        </div>

        <div class="row">
          <button id="run-umap">Run UMAP</button>
          <span id="status" class="status"></span>
        </div>
      </section>

      <section class="panel plot-area">
        <h2>UMAP</h2>
        <div class="plot-frame">
          <iframe id="umap-frame" title="UMAP interactive plot" style="display: none;"></iframe>
          <img id="umap-image" alt="UMAP plot will appear here">
        </div>
        <div id="run-summary" class="summary"></div>
      </section>
    </div>

    <script>
      const datasetList = document.getElementById("dataset-list");
      const sampleSlider = document.getElementById("sample-slider");
      const sampleValue = document.getElementById("sample-value");
      const sampleInput = document.getElementById("sample-input");
      const maxSamplesInput = document.getElementById("max-samples");
      const umapNeighbors = document.getElementById("umap-neighbors");
      const umapMinDist = document.getElementById("umap-min-dist");
      const umapMetric = document.getElementById("umap-metric");
      const umapSpread = document.getElementById("umap-spread");
      const runBtn = document.getElementById("run-umap");
      const saveBtn = document.getElementById("save-umap");
      const saveName = document.getElementById("save-name");
      const outputDirEl = document.getElementById("output-dir");
      const toggleBtn = document.getElementById("toggle-panel");
      const sidebarEl = document.getElementById("sidebar");
      let lastAutoName = "";
      const statusEl = document.getElementById("status");
      const imgEl = document.getElementById("umap-image");
      const frameEl = document.getElementById("umap-frame");
      const summaryEl = document.getElementById("run-summary");
      let currentJobId = null;
      let lastCompletedJobId = null;
      let pollTimer = null;

      function setStatus(msg) {
        statusEl.textContent = msg;
      }

      function renderDatasets(datasets) {
        datasetList.innerHTML = "";
        if (!datasets.length) {
          const empty = document.createElement("div");
          empty.className = "status";
          empty.textContent = "No datasets found.";
          datasetList.appendChild(empty);
          return;
        }
        datasets.forEach(item => {
          const name = typeof item === "string" ? item : item.name;
          const count = typeof item === "string" ? null : item.count;
          const label = document.createElement("label");
          label.className = "dataset-item";
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.value = name;
          checkbox.checked = true;
          label.appendChild(checkbox);
          label.appendChild(document.createTextNode(name));
          if (count !== null && count !== undefined) {
            const span = document.createElement("span");
            span.className = "dataset-count";
            span.textContent = `${count} samples`;
            label.appendChild(span);
          }
          datasetList.appendChild(label);
        });
      }

      function getSelectedDatasets() {
        const selected = [];
        datasetList.querySelectorAll("input[type=checkbox]").forEach(box => {
          if (box.checked) {
            selected.push(box.value);
          }
        });
        return selected;
      }

      function formatTimestamp() {
        const now = new Date();
        const pad = (v) => String(v).padStart(2, "0");
        return `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
      }

      function buildSuggestedFilename() {
        const datasets = getSelectedDatasets();
        const samplePercent = getSamplePercent();
        const safePercent = samplePercent.toFixed(2).replace(".", "p");
        const ts = formatTimestamp();
        let dsPart = "none";
        if (datasets.length === 1) {
          dsPart = datasets[0];
        } else if (datasets.length > 1) {
          dsPart = datasets.join("-");
          if (dsPart.length > 60) {
            dsPart = dsPart.slice(0, 60) + "_more";
          }
        }
        return `umap_${dsPart}_${safePercent}pct_${ts}.png`;
      }

      function setAutoName(force = false) {
        const auto = buildSuggestedFilename();
        if (force || !saveName.value || saveName.value === lastAutoName) {
          saveName.value = auto;
          lastAutoName = auto;
        }
      }

      window.__DATASETS_BOOTSTRAP__ = null;

      function applyBootstrap() {
        const boot = window.__DATASETS_BOOTSTRAP__;
        if (boot && Array.isArray(boot.datasets)) {
          renderDatasets(boot.datasets);
          if (boot.output_dir) {
            outputDirEl.textContent = boot.output_dir;
          }
          setAutoName(true);
          return true;
        }
        return false;
      }

      async function fetchDatasets() {
        try {
          const res = await fetch("/api/datasets");
          if (!res.ok) {
            const text = await res.text();
            throw new Error(text || "Failed to load datasets");
          }
          const data = await res.json();
          const datasets = Array.isArray(data.datasets) ? data.datasets : [];
          renderDatasets(datasets);
          if (data.output_dir) {
            outputDirEl.textContent = data.output_dir;
          }
          setAutoName(true);
        } catch (err) {
          if (!applyBootstrap()) {
            datasetList.innerHTML = "";
            const empty = document.createElement("div");
            empty.className = "status";
            const msg = err && err.message ? err.message : "Failed to load datasets.";
            empty.textContent = `${msg} (Make sure you opened http://127.0.0.1:8000)`;
            datasetList.appendChild(empty);
            setStatus("Dataset list failed to load.");
          }
        }
      }

      function getSamplePercent() {
        const sliderVal = parseFloat(sampleSlider.value);
        const inputVal = parseFloat(sampleInput.value);
        if (!Number.isNaN(inputVal) && document.activeElement === sampleInput) {
          return inputVal;
        }
        return sliderVal;
      }

      function syncSampleControls(value) {
        const safeVal = Math.min(100, Math.max(0.01, value));
        sampleSlider.value = safeVal;
        sampleInput.value = safeVal;
        sampleValue.textContent = safeVal.toFixed(2);
      }

      function getMaxSamples() {
        const raw = parseInt(maxSamplesInput.value, 10);
        if (Number.isNaN(raw) || raw <= 0) {
          return null;
        }
        return raw;
      }

      function getUmapParams() {
        const nNeighbors = parseInt(umapNeighbors.value, 10);
        const minDist = parseFloat(umapMinDist.value);
        const metric = umapMetric.value || "euclidean";
        const spread = parseFloat(umapSpread.value);
        return {
          n_neighbors: Number.isNaN(nNeighbors) ? null : nNeighbors,
          min_dist: Number.isNaN(minDist) ? null : minDist,
          metric,
          spread: Number.isNaN(spread) ? null : spread
        };
      }

      async function runUmap() {
        const datasets = getSelectedDatasets();
        const samplePercent = getSamplePercent();
        if (!datasets.length) {
          setStatus("Select at least one dataset.");
          return;
        }
        setAutoName();
        runBtn.disabled = true;
        setStatus("Starting UMAP job...");
        summaryEl.textContent = "";
        const sample = samplePercent / 100.0;
        const maxSamples = getMaxSamples();
        const umapParams = getUmapParams();
        const res = await fetch("/api/umap", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            datasets,
            sample,
            max_samples: maxSamples,
            umap_params: umapParams
          })
        });
        if (!res.ok) {
          const text = await res.text();
          setStatus(text || "UMAP failed.");
          runBtn.disabled = false;
          return;
        }
        const data = await res.json();
        currentJobId = data.job_id;
        localStorage.setItem("umapJobId", currentJobId);
        setStatus(`Job ${currentJobId} queued...`);
        startPolling(currentJobId);
        runBtn.disabled = false;
      }

      async function fetchJob(jobId) {
        const res = await fetch(`/api/job/${jobId}`);
        if (!res.ok) {
          throw new Error(await res.text());
        }
        return await res.json();
      }

      async function fetchJobResult(jobId) {
        const res = await fetch(`/api/job/${jobId}/result`);
        if (!res.ok) {
          throw new Error(await res.text());
        }
        return await res.json();
      }

      function updateSummary(summary) {
        const total = summary.total_points || 0;
        const duration = summary.duration_sec || 0;
        const counts = summary.counts || {};
        const lines = [`Points: ${total}`, `UMAP time: ${duration.toFixed(2)}s`];
        Object.keys(counts).forEach(name => {
          const item = counts[name] || {};
          const b = item.Benign || 0;
          const m = item.Malicious || 0;
          const t = b + m;
          lines.push(`${name}: ${t} (B ${b} / M ${m})`);
        });
        summaryEl.innerHTML = lines.join("<br>");
      }

      async function startPolling(jobId) {
        if (pollTimer) {
          clearInterval(pollTimer);
        }
        async function pollOnce() {
          try {
            const job = await fetchJob(jobId);
            if (job.status === "done") {
              clearInterval(pollTimer);
              pollTimer = null;
              lastCompletedJobId = jobId;
              const result = await fetchJobResult(jobId);
              if (result.html) {
                frameEl.srcdoc = result.html;
                frameEl.style.display = "block";
                imgEl.style.display = "none";
              } else if (result.image) {
                imgEl.src = result.image;
                imgEl.style.display = "block";
                frameEl.style.display = "none";
              }
              if (result.summary) {
                updateSummary(result.summary);
              }
              setStatus(`Job ${jobId} done.`);
            } else if (job.status === "error" || job.status === "stale") {
              clearInterval(pollTimer);
              pollTimer = null;
              setStatus(`Job ${jobId} failed: ${job.error || "unknown error"}`);
            } else {
              setStatus(`Job ${jobId} ${job.status}...`);
            }
          } catch (err) {
            setStatus(`Job ${jobId} status error.`);
          }
        }
        await pollOnce();
        pollTimer = setInterval(pollOnce, 3000);
      }

      async function saveUmap() {
        saveBtn.disabled = true;
        setStatus("Saving...");
        setAutoName();
        const name = saveName.value.trim();
        const res = await fetch("/api/save", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, job_id: lastCompletedJobId || currentJobId })
        });
        if (!res.ok) {
          const text = await res.text();
          setStatus(text || "Save failed.");
          saveBtn.disabled = false;
          return;
        }
        const data = await res.json();
        const msg = data.html ? `Saved: ${data.path} (html: ${data.html})` : `Saved: ${data.path || "done"}`;
        setStatus(msg);
        saveBtn.disabled = false;
      }

      document.getElementById("select-all").addEventListener("click", () => {
        datasetList.querySelectorAll("input[type=checkbox]").forEach(box => {
          box.checked = true;
        });
      });

      document.getElementById("clear-all").addEventListener("click", () => {
        datasetList.querySelectorAll("input[type=checkbox]").forEach(box => {
          box.checked = false;
        });
      });

      sampleSlider.addEventListener("input", () => {
        syncSampleControls(parseFloat(sampleSlider.value));
        setAutoName();
      });

      sampleInput.addEventListener("input", () => {
        syncSampleControls(parseFloat(sampleInput.value));
        setAutoName();
      });

      runBtn.addEventListener("click", runUmap);
      saveBtn.addEventListener("click", saveUmap);
      datasetList.addEventListener("change", () => {
        setAutoName();
      });
      toggleBtn.addEventListener("click", () => {
        const hidden = document.body.classList.toggle("sidebar-hidden");
        if (hidden) {
          const width = sidebarEl.getBoundingClientRect().width;
          sidebarEl.dataset.prevWidth = Math.round(width);
          toggleBtn.textContent = "Show panel";
        } else {
          const prev = sidebarEl.dataset.prevWidth;
          if (prev) {
            sidebarEl.style.width = `${prev}px`;
          }
          toggleBtn.textContent = "Hide panel";
        }
      });

      syncSampleControls(parseFloat(sampleSlider.value));

      applyBootstrap();
      fetchDatasets().then(() => {
        setStatus("Ready.");
        const saved = localStorage.getItem("umapJobId");
        if (saved) {
          currentJobId = saved;
          startPolling(saved);
        }
      });
    </script>
  </body>
</html>
