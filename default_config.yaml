experiment_name: default_experiment

# root of the dataset folder
# should contain subfolders with ID in the names (e.g., 001, 002, ...)
root: ../../../dataset-private
seed: 1111
validation_split: 0.1
batch_size_train: 500
batch_size_test: 1000

classes: ["Benign", "Malicious"]

# plotting scripts (paths are relative to the config file by default)
plotting_pths:
  training: "./src/plot_utils/plot_train_perf.py"
  testing: "./src/plot_utils/plot_test_perf.py"

paths:
  experiment_dir: ./experiments

dataset_loader:
  data_subdir: data
  persist_cache_threshold: 20000
  cache_dir: ./cache
  labeled_filenames:
    - conn.log.labeled
    - labeled-conn.log
    - conn.log
  file_encoding: utf-8
  file_errors: ignore
  shuffle_per_epoch: false

features:
  default_label: Benign
  protocols_to_discard:
    - arp
    - ARP
    - icmp
    - igmp
    - ipv6-icmp
    - ""

preprocessing:
  # steps are (name, type, params)
  # runner will instantiate these via factory mapping (type -> class)
  steps:
    - name: "scaler"
      type: "StandardScaler"
      params: {}
    # - name: "pca"
    #  type: "IncrementalPCA"
    #  params:
    #    n_components: 7
  save_steps: true
  step_filename_template: "{name}.bin"

model:
  wrapper: RiverClassifierWrapper
  classifier_type: ADWINBoostingClassifier
  classifier_params:
    n_models: 20
    model:
      type: HoeffdingAdaptiveTreeClassifier
      params:
        max_depth: 12
        grace_period: 150
        max_size: 0
        delta: 1.0e-6
  save_name: classifier_adwinboost.bin

commands:
  - name: "train_seq" # command name
    command: "train" # train/test
    mixer: # mixer = data selection strategy: sequence, balanced, random
      type: "sequence"
      # in sequence, drain all of the datasets to the end,
      # then begin with a new one
      datasets: ["001", "008", "009", "010", "011", "012", "013", "014", "015", "016", "017", "022", "023", "024", "027", "028", "029", "032", "033", "034"]


  - name: "test_all"
    command: "test"
    mixer:
      type: "sequence"
      # in sequence, drain all of the datasets to the end,
      # then begin with a new one  BUT here TEST ALL
      datasets: ["001", "008", "009", "010", "011", "012", "013", "014", "015", "016", "017", "018", "020", "021", "025", "026", "030", "031", "035", "036", "037"]
