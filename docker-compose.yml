version: "3.8"

services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: slips-pipeline:latest
    container_name: slips-pipeline
    mem_reservation: "16g"    # soft RAM target before hard cap
    mem_limit: "20g"          # RAM cap
    memswap_limit: "32g"      # RAM + swap cap
    mem_swappiness: 60       # higher -> swap earlier under pressure
    oom_kill_disable: false
    cpus: "4"
    volumes:
      - .:/workspace/pipeline_ml_training_for_SLIPS:cached
    working_dir: /workspace/pipeline_ml_training_for_SLIPS
    tty: true
    stdin_open: true
    command: bash
